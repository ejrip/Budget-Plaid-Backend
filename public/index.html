<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eli's Budget</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header p {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .buckets {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .bucket {
      background: #161616;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
    }

    .bucket-icon {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .bucket-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .bucket-amount {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .bucket-amount.school { color: #4ade80; }
    .bucket-amount.fun { color: #f59e0b; }
    .bucket-amount.bills { color: #60a5fa; }

    .bucket-sub {
      font-size: 10px;
      color: #555;
      margin-top: 3px;
    }

    .goal-bar-wrap {
      background: #161616;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 28px;
    }

    .goal-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .goal-bar-header span:first-child {
      font-size: 13px;
      color: #aaa;
    }

    .goal-bar-header span:last-child {
      font-size: 13px;
      font-weight: 600;
      color: #4ade80;
    }

    .goal-bar {
      background: #222;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .goal-bar-fill {
      background: linear-gradient(90deg, #4ade80, #22d3ee);
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s ease;
    }

    .goal-sub {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      color: #555;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-connect {
      background: #fff;
      color: #000;
    }

    .btn-sync {
      background: #1a1a1a;
      color: #60a5fa;
      border: 1px solid #2a2a2a;
    }

    .status-bar {
      background: #161616;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: #666;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }

    .status-dot.connected { background: #4ade80; }
    .status-dot.syncing {
      background: #f59e0b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 12px;
    }

    .transactions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .txn {
      background: #161616;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .txn-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .txn-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .txn-icon.fun { background: #2a1f00; }
    .txn-icon.bills { background: #001a2a; }
    .txn-icon.school { background: #002a10; }

    .txn-name {
      font-size: 14px;
      font-weight: 500;
      color: #eee;
    }

    .txn-meta {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }

    .txn-right {
      text-align: right;
    }

    .txn-amount {
      font-size: 15px;
      font-weight: 600;
      color: #f0f0f0;
    }

    .txn-bucket {
      font-size: 10px;
      margin-top: 2px;
      padding: 2px 7px;
      border-radius: 99px;
    }

    .txn-bucket.fun { background: #2a1f00; color: #f59e0b; }
    .txn-bucket.bills { background: #001a2a; color: #60a5fa; }
    .txn-bucket.school { background: #002a10; color: #4ade80; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #444;
      font-size: 14px;
      line-height: 1.6;
    }

    .empty-state .big { font-size: 32px; margin-bottom: 12px; }

    .income-section {
      margin-top: 28px;
    }

    .income-form {
      background: #161616;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 16px;
    }

    .income-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .income-row.three { grid-template-columns: 1fr 1fr 1fr; }

    input, select {
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #eee;
      padding: 10px 12px;
      font-size: 13px;
      width: 100%;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #444;
    }

    select option { background: #1a1a1a; }

    .btn-add-income {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #4ade80;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-add-income:hover { opacity: 0.8; }

    .download-btn {
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      background: #4ade80;
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .download-btn:hover { opacity: 0.85; }
    .download-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>Eli's Budget</h1>
  <p id="last-sync">Not synced yet</p>
</header>

<!-- Buckets -->
<div class="buckets">
  <div class="bucket">
    <div class="bucket-icon">🎓</div>
    <div class="bucket-label">School</div>
    <div class="bucket-amount school" id="school-amount">$0</div>
    <div class="bucket-sub" id="school-goal">Goal: $10,000</div>
  </div>
  <div class="bucket">
    <div class="bucket-icon">🎉</div>
    <div class="bucket-label">Fun</div>
    <div class="bucket-amount fun" id="fun-amount">$0</div>
    <div class="bucket-sub">available</div>
  </div>
  <div class="bucket">
    <div class="bucket-icon">💡</div>
    <div class="bucket-label">Bills</div>
    <div class="bucket-amount bills" id="bills-amount">$0</div>
    <div class="bucket-sub">allocated</div>
  </div>
</div>

<!-- School Goal Bar -->
<div class="goal-bar-wrap">
  <div class="goal-bar-header">
    <span>School Fund Progress</span>
    <span id="goal-pct">0%</span>
  </div>
  <div class="goal-bar">
    <div class="goal-bar-fill" id="goal-fill" style="width:0%"></div>
  </div>
  <div class="goal-sub">
    <span id="goal-saved">$0 saved</span>
    <span id="goal-remaining">$10,000 to go</span>
  </div>
</div>

<!-- Actions -->
<div class="actions">
  <button class="btn btn-connect" id="connect-btn" onclick="connectBank()">Connect Bank</button>
  <button class="btn btn-sync" id="sync-btn" onclick="syncTransactions()" disabled>Sync Now</button>
</div>

<!-- Status -->
<div class="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <span id="status-text">Connect your bank to get started</span>
</div>

<!-- Transactions -->
<div class="section-title">Recent Transactions</div>
<div class="transactions" id="txn-list">
  <div class="empty-state">
    <div class="big">🏦</div>
    Connect your bank and sync to see transactions auto-categorized into your buckets.
  </div>
</div>

<!-- Income Log -->
<div class="income-section">
  <div class="section-title">Log Income</div>
  <div class="income-form">
    <div class="income-row">
      <select id="income-type">
        <option value="caddy">Caddy Loop</option>
        <option value="internship">Internship</option>
        <option value="other">Other</option>
      </select>
      <input type="date" id="income-date" />
    </div>
    <div class="income-row three">
      <input type="number" id="income-hours" placeholder="Hours" />
      <input type="number" id="income-pay" placeholder="Pay ($)" />
      <input type="text" id="income-notes" placeholder="Notes" />
    </div>
    <button class="btn-add-income" onclick="addIncome()">+ Add Income</button>
  </div>
</div>

<!-- Download Updated Excel -->
<button class="download-btn" id="download-btn" onclick="downloadExcel()" disabled>
  Download Updated Budget.xlsx
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const BACKEND = 'https://budget-plaid-backend-production.up.railway.app';

  // Budget state — seeded from your Excel file
  const state = {
    schoolFund: 1914,
    funFund: 131.46,
    billsFund: 402,
    schoolGoal: 10000,
    loanRemaining: 850,
    transactions: [],
    incomeLog: [
      { date: '2024-01-01', type: 'Caddy Loop', hours: 4.5, pay: 220, notes: '' },
      { date: '2024-01-02', type: 'Caddy Loop', hours: 4, pay: 230, notes: '' },
      { date: '2024-01-03', type: 'Caddy Loop', hours: 4.5, pay: 240, notes: '' },
      { date: '2024-01-04', type: 'Caddy Loop', hours: 8, pay: 530, notes: '' },
      { date: '2024-01-05', type: 'Internship', hours: 8, pay: 200, notes: '' },
      { date: '2024-01-06', type: 'Internship', hours: 8, pay: 200, notes: '' },
    ],
    spendingLog: [
      { date: '2024-01-02', category: 'Grottos/Bar', amount: 61, notes: 'first time mas 21' },
      { date: '2024-01-02', category: 'Other', amount: 32, notes: 'uber' },
      { date: '2024-01-02', category: 'Other', amount: 35, notes: 'Haircut' },
      { date: '2024-01-03', category: 'Gas/NYC', amount: 24, notes: 'Gas/C4' },
      { date: '2024-01-04', category: 'Gas/NYC', amount: 23, notes: '' },
      { date: '2024-01-04', category: 'Food', amount: 18, notes: 'chip for 2 loops and coffee' },
    ]
  };

  // Category mapping: Plaid merchant → your Excel categories → bucket
  const categoryMap = {
    // Fun bucket
    'grottos': { category: 'Grottos/Bar', bucket: 'fun' },
    'bar': { category: 'Grottos/Bar', bucket: 'fun' },
    'parker house': { category: 'Parker House', bucket: 'fun' },
    'restaurant': { category: 'Food', bucket: 'fun' },
    'wawa': { category: 'Food', bucket: 'fun' },
    'pizza': { category: 'Food', bucket: 'fun' },
    'food': { category: 'Food', bucket: 'fun' },
    'uber eats': { category: 'Food', bucket: 'fun' },
    'doordash': { category: 'Food', bucket: 'fun' },
    'uber': { category: 'Other', bucket: 'fun' },
    'lyft': { category: 'Other', bucket: 'fun' },
    'amazon': { category: 'Other', bucket: 'fun' },
    'target': { category: 'Other', bucket: 'fun' },
    'homegoods': { category: 'Other', bucket: 'fun' },
    'crunch': { category: 'Other', bucket: 'fun' },
    'spotify': { category: 'Other', bucket: 'fun' },
    'apple': { category: 'Other', bucket: 'fun' },
    // Bills bucket
    'gas': { category: 'Gas/NYC', bucket: 'bills' },
    'shell': { category: 'Gas/NYC', bucket: 'bills' },
    'exxon': { category: 'Gas/NYC', bucket: 'bills' },
    'bp': { category: 'Gas/NYC', bucket: 'bills' },
    'costco': { category: 'Gas/NYC', bucket: 'bills' },
    'transit': { category: 'Gas/NYC', bucket: 'bills' },
    'bus': { category: 'Gas/NYC', bucket: 'bills' },
    'njtransit': { category: 'Gas/NYC', bucket: 'bills' },
    'loan': { category: 'Loan/Rent/Required', bucket: 'bills' },
    'rent': { category: 'Loan/Rent/Required', bucket: 'bills' },
    'insurance': { category: 'Loan/Rent/Required', bucket: 'bills' },
    'phone': { category: 'Loan/Rent/Required', bucket: 'bills' },
    'verizon': { category: 'Loan/Rent/Required', bucket: 'bills' },
    'att': { category: 'Loan/Rent/Required', bucket: 'bills' },
  };

  function categorize(txn) {
    const name = (txn.name || txn.merchant_name || '').toLowerCase();
    for (const [keyword, mapping] of Object.entries(categoryMap)) {
      if (name.includes(keyword)) return mapping;
    }
    return { category: 'Other', bucket: 'fun' };
  }

  function fmt(n) {
    return '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function updateUI() {
    document.getElementById('school-amount').textContent = fmt(state.schoolFund);
    document.getElementById('fun-amount').textContent = fmt(state.funFund);
    document.getElementById('bills-amount').textContent = fmt(state.billsFund);

    const pct = Math.min(100, (state.schoolFund / state.schoolGoal) * 100);
    document.getElementById('goal-pct').textContent = pct.toFixed(1) + '%';
    document.getElementById('goal-fill').style.width = pct + '%';
    document.getElementById('goal-saved').textContent = fmt(state.schoolFund) + ' saved';
    document.getElementById('goal-remaining').textContent = fmt(state.schoolGoal - state.schoolFund) + ' to go';
  }

  function renderTransactions() {
    const list = document.getElementById('txn-list');
    if (state.transactions.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="big">🏦</div>Connect your bank and sync to see transactions auto-categorized into your buckets.</div>`;
      return;
    }

    const icons = { fun: '🎉', bills: '💡', school: '🎓' };
    list.innerHTML = state.transactions.slice(0, 30).map(t => {
      const { category, bucket } = categorize(t);
      return `
        <div class="txn">
          <div class="txn-left">
            <div class="txn-icon ${bucket}">${icons[bucket]}</div>
            <div>
              <div class="txn-name">${t.name || t.merchant_name || 'Transaction'}</div>
              <div class="txn-meta">${t.date} · ${category}</div>
            </div>
          </div>
          <div class="txn-right">
            <div class="txn-amount">${fmt(t.amount)}</div>
            <div class="txn-bucket ${bucket}">${bucket}</div>
          </div>
        </div>`;
    }).join('');
  }

  async function connectBank() {
    setStatus('syncing', 'Connecting to your bank...');
    try {
      const res = await fetch(`${BACKEND}/create-link-token`, { method: 'POST' });
      const data = await res.json();

      const handler = Plaid.create({
        token: data.link_token,
        onSuccess: async (public_token) => {
          setStatus('syncing', 'Authenticating...');
          await fetch(`${BACKEND}/exchange-token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ public_token })
          });
          setStatus('connected', 'Bank connected! Syncing transactions...');
          document.getElementById('connect-btn').textContent = '✓ Connected';
          document.getElementById('connect-btn').disabled = true;
          document.getElementById('sync-btn').disabled = false;
          document.getElementById('download-btn').disabled = false;
          await syncTransactions();
        },
        onExit: () => {
          setStatus('', 'Connect your bank to get started');
        }
      });
      handler.open();
    } catch (e) {
      setStatus('', 'Connection failed — check your backend is running');
    }
  }

  async function syncTransactions() {
    setStatus('syncing', 'Syncing transactions...');
    document.getElementById('sync-btn').disabled = true;
    try {
      const res = await fetch(`${BACKEND}/transactions`);
      const txns = await res.json();
      state.transactions = txns;

      // Add new transactions to spending log and update bucket totals
      let funSpent = 0, billsSpent = 0;
      txns.forEach(t => {
        const { category, bucket } = categorize(t);
        if (bucket === 'fun') funSpent += t.amount;
        if (bucket === 'bills') billsSpent += t.amount;

        // Add to spending log if not already there
        const exists = state.spendingLog.find(s => s.notes === t.transaction_id);
        if (!exists) {
          state.spendingLog.push({
            date: t.date,
            category,
            amount: t.amount,
            notes: t.name || ''
          });
        }
      });

      state.funFund = Math.max(0, state.funFund - funSpent);
      state.billsFund = Math.max(0, state.billsFund - billsSpent);

      const now = new Date().toLocaleTimeString();
      document.getElementById('last-sync').textContent = `Last synced ${now}`;
      setStatus('connected', `Synced ${txns.length} transactions`);
      document.getElementById('sync-btn').disabled = false;
      updateUI();
      renderTransactions();
    } catch (e) {
      setStatus('connected', 'Sync failed — try again');
      document.getElementById('sync-btn').disabled = false;
    }
  }

  function setStatus(type, text) {
    const dot = document.getElementById('status-dot');
    dot.className = 'status-dot' + (type ? ' ' + type : '');
    document.getElementById('status-text').textContent = text;
  }

  function addIncome() {
    const type = document.getElementById('income-type').value;
    const date = document.getElementById('income-date').value;
    const hours = parseFloat(document.getElementById('income-hours').value) || 0;
    const pay = parseFloat(document.getElementById('income-pay').value) || 0;
    const notes = document.getElementById('income-notes').value;

    if (!date || pay === 0) {
      alert('Please enter a date and pay amount.');
      return;
    }

    // Apply your Excel allocation logic
    const loanPaid = state.loanRemaining <= 0;
    let schoolAlloc, funAlloc, billsAlloc;

    if (type === 'caddy') {
      schoolAlloc = loanPaid ? pay * 0.7 : pay * 0.7;
      funAlloc = loanPaid ? pay * 0.3 : pay * 0.2;
      billsAlloc = loanPaid ? 0 : pay * 0.1;
    } else {
      schoolAlloc = loanPaid ? pay * 0.7 : pay * 0.5;
      funAlloc = loanPaid ? pay * 0.3 : pay * 0.3;
      billsAlloc = loanPaid ? 0 : pay * 0.2;
    }

    state.schoolFund += schoolAlloc;
    state.funFund += funAlloc;
    state.billsFund += billsAlloc;

    state.incomeLog.push({ date, type, hours, pay, notes });

    // Clear fields
    document.getElementById('income-hours').value = '';
    document.getElementById('income-pay').value = '';
    document.getElementById('income-notes').value = '';
    document.getElementById('income-date').value = '';

    document.getElementById('download-btn').disabled = false;
    updateUI();
  }

  function downloadExcel() {
    const wb = XLSX.utils.book_new();

    // Dashboard sheet
    const dashData = [
      ['Eli Simple Caddy + Internship Budget Dashboard'],
      [],
      ['School Goal', state.schoolGoal, '', 'Money Buckets', 'Balance'],
      ['Current School Fund', state.schoolFund, '', 'School Fund', state.schoolFund],
      ['Remaining to Goal', state.schoolGoal - state.schoolFund, '', 'Fun Fund', state.funFund],
      ['Loan Remaining', state.loanRemaining, '', 'Bills Fund', state.billsFund],
      ['Safe Fun Money', state.funFund],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dashData), 'Dashboard');

    // Income Log
    const incomeHeaders = ['Date', 'Source', 'Hours Worked', 'Internship Rate', 'Caddy/Other Pay Entered', 'Total Amount'];
    const incomeRows = state.incomeLog.map(r => [r.date, r.type, r.hours, r.type === 'internship' ? 25 : '', r.type !== 'internship' ? r.pay : '', r.pay]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([incomeHeaders, ...incomeRows]), 'Income Log');

    // Spending Log
    const spendHeaders = ['Date', 'Category', 'Amount', 'Notes'];
    const spendRows = state.spendingLog.map(r => [r.date, r.category, r.amount, r.notes]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([spendHeaders, ...spendRows]), 'Spending Log');

    XLSX.writeFile(wb, 'Budget_Tool_Updated.xlsx');
  }

  // Init
  updateUI();
  document.getElementById('income-date').valueAsDate = new Date();
</script>
</body>
</html>
